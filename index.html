<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Vinos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdf6f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #5c2a2a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #7a3e3e;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .productos {
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .producto {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 10px;
      max-width: 300px;
    }
    .producto img {
      width: 100%;
      height: auto;
      border-bottom: 1px solid #ddd;
    }
    .producto h3 {
      margin: 10px 0;
      color: #5c2a2a;
    }
    .producto p {
      color: #555;
    }
    .producto a {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 10px 15px;
      margin-top: 10px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    footer {
      background-color: #7a3e3e;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍷 Tienda de Vinos</h1>
    <p>Catálogo de vinos y accesorios</p>
  </header>

  <nav>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Ofertas</a>
    <a href="#">Contacto</a>
  </nav>

  <section class="productos">
    <div class="producto">
      <img src="vino-borgoña.jpg" alt="Vino Borgoña Cavas">
      <h3>VINO BORGOÑA CAVAS</h3>
      <p>Precio x Caja (12 botellas): S/ 100.00<br>Precio x Pack: S/ 20.00</p>
      <a href="https://wa.me/51972534065" target="_blank">📲 Comprar por WhatsApp</a>
    </div>
  </section>

  <footer>
    <p>© 2026 Tienda de Vinos | Síguenos en redes sociales</p>
  </footer>
</body>
</html>
